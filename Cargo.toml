[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
dms-engine = { path = "crates/engine" }
dms-strfmt = { path = "crates/strfmt" }
dms-sav = { path = "crates/sav" }
dms-types = { path = "crates/types" }
dms-clem = { path = "crates/clem" }
dms-io = { path = "crates/io" }
dms-stream = { path = "crates/stream" }
dms-catalog = { path = "crates/catalog" }
dms-exec = { path = "crates/exec" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
panic = "unwind"
