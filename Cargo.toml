[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
dms-engine = { path = "crates/engine" }
dms-strfmt = { path = "crates/strfmt" }
dms-sav = { path = "crates/sav" }
dms-types = { path = "crates/types" }
dms-pmml = { path = "crates/pmml" }
dms-algo = { path = "crates/algo" }
dms-clem = { path = "crates/clem" }
dms-io = { path = "crates/io" }
dms-stream = { path = "crates/stream" }
dms-catalog = { path = "crates/catalog" }
dms-exec = { path = "crates/exec" }
dms-ui = { path = "crates/ui" }
dms-macos-open = { path = "crates/macos-open" }
# GUI (L6 and apps only; `cargo xtask layers` enforces it). Licences: docs/gui/DESIGN.md §9.
egui = "=0.37.0"
# No default features: the app uses system fonts only (egui's bundled fonts are OFL/UFL; they
# stay in tests, docs/gui/DESIGN.md §11.4). `winit` is direct so the app can install the macOS
# open-documents delegate between creating and running the event loop.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "persistence", "system_fonts", "wgpu"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
egui_extras = { version = "=0.37.0", default-features = false }
egui_system_font_provider = "=0.37.0"
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }
muda = { version = "=0.21.2", default-features = false }
rfd = "=0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
panic = "unwind"
